version: '3.8'
services:
  neo4j:
    image: neo4j:5.12
    container_name: kickscout_db
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"] # Essential for advanced data optimization
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/import:/import